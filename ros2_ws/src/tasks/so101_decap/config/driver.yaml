# so101_driver settings for this task (read by so101_bringup).
# Simulation: scene_decap.xml (generated by sim/tools/make_decap_scene.py): robot on an
# 18 cm riser, bottle in the printed fixture, cap box, bottle box.
so101_driver:
  ros__parameters:
    scene: scene_decap.xml
    camera_name: overhead_cam
    camera_width: 320
    camera_height: 240
    camera_hz: 5.0
    start_pose: [1.85, -1.7, 1.55, 0.7, 0.0, 0.0]   # folded rest, away from the bottle
