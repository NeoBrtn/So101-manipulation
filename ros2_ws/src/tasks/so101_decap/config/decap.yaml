# Phase 2 parameters. Robot frame: x forward, y left, z up from the robot base; the
# table is table_z below it (riser). Bottle heights are from the bottle's bottom.
decap:
  ros__parameters:
    table_z: -0.18               # riser height (negative)
    fixture_xy: [0.20, 0.0]      # hardware/bottle_fixture, fixed to the table
    cap_box_xy: [0.12, -0.22]
    bottle_box_xy: [0.02, 0.25]
    # Auchan 50 cl sparkling water bottle (220 mm)
    cap_center: 0.2135
    cap_diameter: 0.028
    neck_center: 0.1975
    neck_diameter: 0.025
    # Gripper: the TCP is on the fixed finger; a round part's axis is fixed_jaw_face + d/2
    # away along TCP x, and the TCP goes grasp_depth below its centre (measured in sim)
    fixed_jaw_face: 0.004
    grasp_depth: 0.008
    # Thread (28 mm PCO 1881): loosened cap
    thread_pitch: 0.0027
    unscrew_turns: 1.5
    stroke_deg: 240.0
    stroke_time: 6.0             # s per stroke
    holding_min_pct: 3.0         # gripper below this after closing: nothing in it
    # Pick and insertion
    min_reach: 0.12              # m, horizontal base -> bottle
    max_reach: 0.30
    move_threshold: 0.015        # m: the bottle moved during the approach -> replan
    stale_timeout: 1.0
    detect_timeout: 10.0
    max_retries: 3
    carry_bottom: 0.06           # bottle bottom above the table while carried (cup rim: 38 mm)
    insert_preload: 0.003        # push this far below the seated height
    seat_tolerance: 0.004        # TCP higher than this above seated: the feet are on the ribs
    home_on_start: true

bottle_perception:
  ros__parameters:
    camera: overhead_cam
    table_z: -0.18
    cap_top: 0.222               # m, top of the cap above the bottle's bottom
    # OpenCV HSV (H 0-180), low h s v, high h s v: green cap (sim, and measured on the real one)
    cap_hsv: [60, 110, 35, 88, 255, 255]
    min_blob_area: 15
    publish_hz: 10.0
